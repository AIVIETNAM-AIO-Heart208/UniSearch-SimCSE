# D2 corpus: undergraduate training regulations of the University of Science (HCMUS), VNU-HCM.
# Decision D-17 (docs/application/PROJECT.md §8.3). Full texts are kept in data/raw/d2/ (git-ignored)
# until the right to publish them is confirmed (PROJECT.md §8.3, Q7).
# Only the regulation articles go into the corpus. The 2026 file also contains the signing decision
# (Quyết định 3087, three articles); those are not indexed, so article numbers are never ambiguous.
# The 2021 PDF contains the regulation only, without its signing decision.

