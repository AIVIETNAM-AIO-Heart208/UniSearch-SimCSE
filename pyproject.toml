[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simcse-lab"
version = "0.1.0"
description = "SimCSE reproduction, evaluation, and practical application for Lab 03"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.5.1"]

[project.optional-dependencies]
test = ["pytest>=8", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]
